apiVersion: v1
kind: Service
metadata:
  name: raft-svc
spec:
  clusterIP: None
  selector:
    app: raft
  ports:
  - name: rpc
    port: 29280
    protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raft
spec:
  serviceName: "raft-svc"
  replicas: 3
  selector:
    matchLabels:
      app: raft
  template:
    metadata:
      labels:
        app: raft
    spec:
      containers:
      - name: raft-node
        image: localhost:5001/nodoraft:5000
        imagePullPolicy: Always
        args:
        - "$(MY_ID)"
        - "raft-0.raft-svc:29280"
        - "raft-1.raft-svc:29280"
        - "raft-2.raft-svc:29280"
        env:
        - name: MY_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 29280
        readinessProbe:
          tcpSocket:
            port: 29280
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 100

